# PID Ready — Shopify app configuration.
# Deploy config to Shopify: npx shopify app deploy (from apps/shopify)
client_id = "14e4b73d7eb1e9959406e22419c06133"
name = "PID Ready"
application_url = "https://pid.revguardlabs.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# read_orders: country + line items of the last 60 days, to show only items shipped to the EU.
# No customer names, emails, phones or addresses are read.
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders"

[auth]
redirect_urls = [
  "https://pid.revguardlabs.com/auth/callback",
  "https://pid.revguardlabs.com/auth/shopify/callback",
  "https://pid.revguardlabs.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["products/create", "products/update"]
  uri = "/webhooks/products"

  [[webhooks.subscriptions]]
  topics = ["bulk_operations/finish"]
  uri = "/webhooks/bulk_operations/finish"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["app_subscriptions/update"]
  uri = "/webhooks/app_subscriptions/update"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
